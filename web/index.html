<!doctype html>
<html lang="uk">
<head>
<link rel="stylesheet" href="/vendor/xterm.css">
<meta charset="utf-8">
<meta name="theme-color" content="#050c1c">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Команда</title>
<link rel="icon" href="/icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* «Нічна обсерваторія»: темне небо, напівпрозорі голографічні панелі, біолюмінесцентні акценти */
:root{
  --void:#03060f;--deep:#071226;--glass:rgba(12,34,58,.55);--glass-hi:rgba(18,52,84,.72);
  --ink:#d8f3ff;--muted:#7fa7c2;--line:rgba(110,220,255,.22);--line-hi:rgba(120,235,255,.6);
  --cyan:#43e6ff;--teal:#2dd4bf;--amber:#c38bff;--violet:#7aa2ff;--rose:#ff6b9a;
  --glow-cyan:0 0 0 1px rgba(67,230,255,.35),0 0 18px rgba(67,230,255,.18),inset 0 0 22px rgba(67,230,255,.06);
  --glow-amber:0 0 0 1px rgba(195,139,255,.55),0 0 22px rgba(195,139,255,.25),inset 0 0 22px rgba(195,139,255,.08);
  --glow-violet:0 0 0 1px rgba(122,162,255,.45),0 0 18px rgba(122,162,255,.2),inset 0 0 22px rgba(122,162,255,.06);
  --panel-w:50vw;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:14px/1.5 "Exo 2",system-ui,sans-serif;letter-spacing:.01em;background:transparent}
html{min-height:100%;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,#fff9 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 38% 62%,#bff6 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 83%,#9ef8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 31%,#fff6 50%,transparent 51%),
    radial-gradient(1px 1px at 93% 78%,#cff7 50%,transparent 51%),radial-gradient(1px 1px at 5% 50%,#fff5 50%,transparent 51%),
    radial-gradient(ellipse 70% 50% at 80% 0%,rgba(67,120,255,.18),transparent 70%),
    radial-gradient(ellipse 60% 50% at 0% 100%,rgba(45,212,191,.13),transparent 70%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(122,162,255,.07),transparent 70%),
    linear-gradient(180deg,#050c1c,#02050c);
  background-attachment:fixed}
::selection{background:rgba(67,230,255,.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(67,230,255,.25);border-radius:8px}
header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(67,230,255,.08),transparent 60%);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
#stats{color:var(--muted);font-size:13px;letter-spacing:.06em}
#stats::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);margin-right:8px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
label{color:var(--muted);font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:var(--cyan)}
#chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px}
.chip{border:1px solid var(--line);background:rgba(12,34,58,.4);color:var(--ink);padding:4px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;transition:.2s}
.chip:hover{border-color:var(--line-hi);box-shadow:0 0 12px rgba(67,230,255,.25)}
.chip.on{background:rgba(67,230,255,.16);border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(67,230,255,.35)}
main{padding:0 20px 28px;transition:margin-right .25s}
body.panel-open main{margin-right:var(--panel-w)}
#room{min-width:0;zoom:var(--fz-board,1)}
#panel-body{zoom:var(--fz-panel,1)}
.fz{display:inline-flex;gap:4px;flex:none}
.fz button{font-size:12px;padding:4px 9px}
#panel a{color:var(--cyan);overflow-wrap:anywhere}
h2{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:none;border-radius:14px;padding:12px 14px;cursor:pointer;
  box-shadow:var(--glow-cyan);backdrop-filter:blur(8px);transition:transform .15s,box-shadow .2s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.06),transparent 35%);}
.card:hover{transform:translateY(-2px)}
.card.waiting{box-shadow:var(--glow-amber)}
.card.waiting .name{color:var(--amber)}
.card.working{box-shadow:var(--glow-cyan)}
.card.working .name{color:var(--cyan)}
.card.waiting_bg,.card.idle_live{box-shadow:var(--glow-violet)}
.card.waiting_bg .name{color:var(--violet)}
.card.sel{outline:2px solid var(--cyan);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.age{white-space:nowrap;color:var(--muted);font-size:12px;font-family:"JetBrains Mono",monospace}
.proj{font-size:12px;margin-top:2px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;border:1px solid var(--line);color:var(--teal);border-radius:999px;padding:0 7px;margin:2px 0 0 4px;font-size:10.5px;letter-spacing:.04em}
.title{margin-top:8px;font-weight:500}
.ask{overflow-wrap:anywhere;margin-top:8px;padding:6px 9px;border-radius:8px;background:rgba(3,10,22,.45);border-left:2px solid var(--line-hi);font-size:13px}
.card.waiting .ask{border-left-color:var(--amber)}
.warn{margin-top:8px;padding:5px 9px;border-radius:8px;background:rgba(195,139,255,.1);border-left:2px solid var(--amber);font-size:12px}
.raw{font-size:12px;margin-top:6px;color:var(--muted);overflow-wrap:anywhere}
.compact{display:flex;flex-wrap:wrap;gap:8px}
.compact .card{padding:5px 12px;opacity:.8;box-shadow:0 0 0 1px var(--line);border-radius:999px}
.day{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin:16px 0 6px;font-weight:500}
.day:first-child{margin-top:0}
.list{display:flex;flex-direction:column;border-left:1px solid var(--line);margin-left:6px}
.row{display:grid;grid-template-columns:52px minmax(120px,210px) 1fr auto;gap:12px;align-items:baseline;padding:7px 12px;cursor:pointer;
  position:relative;border-radius:0 10px 10px 0;transition:background .15s}
.row::before{content:"";position:absolute;left:-4px;top:50%;width:7px;height:7px;border-radius:50%;transform:translateY(-50%);
  background:var(--deep);border:1px solid var(--line-hi)}
.row:hover{background:rgba(67,230,255,.07)}
.row:hover::before{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.row.sel{background:rgba(67,230,255,.12)}
.row .time{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:12px}
.row .rp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted)}
.row .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rn{color:var(--teal);font-size:11.5px;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.8)}
/* Панель звіту: пів екрана справа */
#panel{position:fixed;top:0;right:0;width:var(--panel-w);height:100vh;display:none;flex-direction:column;z-index:10;
  background:linear-gradient(200deg,rgba(14,40,68,.92),rgba(4,12,26,.95));backdrop-filter:blur(14px);
  border-left:1px solid var(--line-hi);box-shadow:-20px 0 60px rgba(0,0,0,.55),-1px 0 24px rgba(67,230,255,.18)}
#panel.open{display:flex}
#panel-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(3,10,22,.4)}
#panel-actions:empty{display:none}
#panel-body{overflow-y:auto;padding:18px 28px 40px;flex:1}
#panel-body > .top:first-child{position:sticky;top:-18px;z-index:2;margin:-18px -28px 0;padding:14px 28px 10px;background:rgba(14,30,52,.96);border-bottom:1px solid var(--line)}
#panel-body .top b{font-size:20px;font-weight:600;color:var(--cyan);letter-spacing:.04em}
#panel-body h2{margin-top:26px}
.state-pill{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-hi);background:rgba(67,230,255,.08);font-size:13px}
/* Markdown */
.md{font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.md p{margin:0 0 10px}
.md h3,.md h4,.md h5{margin:16px 0 6px;color:#fff;font-weight:600;letter-spacing:.03em}
.md h3{font-size:16px}.md h4{font-size:15px}.md h5{font-size:14px;color:var(--teal)}
.md ul,.md ol{margin:4px 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md li::marker{color:var(--cyan)}
.md strong{color:#fff;font-weight:600}
.md em{color:#bfe9ff}
.md a{color:var(--cyan)}
.md code{font-family:"JetBrains Mono",monospace;font-size:12.5px;background:rgba(67,230,255,.1);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#aef3ff}
.md pre{background:rgba(2,8,18,.75);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:6px 0 12px}
.md pre code{background:none;border:none;padding:0;font-size:12.5px;color:#cfefff}
.md blockquote{margin:6px 0 10px;padding:4px 12px;border-left:2px solid var(--violet);color:#cdbfff}
.md table{border-collapse:collapse;margin:6px 0 12px;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.md th{color:var(--cyan);font-weight:500}
.md hr{border:none;border-top:1px solid var(--line);margin:12px 0}
button,input[type=date]{font:inherit;font-size:13px;border:1px solid var(--line-hi);background:rgba(12,34,58,.6);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.2s}
button:disabled{opacity:.4;cursor:not-allowed}
button:hover,input[type=date]:hover{box-shadow:0 0 12px rgba(67,230,255,.3);border-color:var(--cyan)}
button.primary{background:linear-gradient(135deg,rgba(67,230,255,.85),rgba(45,212,191,.85));border-color:var(--cyan);color:#02131f;font-weight:600}
input[type=date]{color-scheme:dark}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(8,26,44,.95);color:var(--ink);border:1px solid var(--cyan);
  box-shadow:0 0 20px rgba(67,230,255,.35);padding:9px 16px;border-radius:10px;display:none;max-width:90vw;z-index:20}
@media (max-width:900px){:root{--panel-w:100vw}body.panel-open main{margin-right:0}
  .row{grid-template-columns:48px 1fr}.row .rp,.row .rn{display:none}}

/* ===== Скло: туманності позаду, матові пластини попереду ===== */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9;animation:drift 38s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:55vw;height:55vw;left:-10vw;top:5vh;background:radial-gradient(circle,rgba(19,201,232,.75) 0%,rgba(19,201,232,.25) 40%,transparent 68%)}
.aurora i:nth-child(2){width:50vw;height:50vw;right:-8vw;top:-12vh;background:radial-gradient(circle,rgba(123,92,255,.8) 0%,rgba(123,92,255,.25) 40%,transparent 68%);animation-duration:46s}
.aurora i:nth-child(3){width:48vw;height:48vw;left:28vw;bottom:-16vh;background:radial-gradient(circle,rgba(31,107,255,.75) 0%,rgba(31,107,255,.2) 40%,transparent 68%);animation-duration:52s}
.aurora i:nth-child(4){width:30vw;height:30vw;right:18vw;top:35vh;background:radial-gradient(circle,rgba(170,100,255,.5) 0%,rgba(170,100,255,.14) 40%,transparent 68%);animation-duration:44s}
.aurora i:nth-child(5){width:34vw;height:34vw;left:8vw;bottom:-6vh;background:radial-gradient(circle,rgba(45,212,191,.6) 0%,transparent 66%);animation-duration:58s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,8vh) scale(.95)}}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
:root{
  --glass-fill:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.05) 45%,rgba(140,230,255,.08));
  --glass-edge:rgba(255,255,255,.28);
  --glass-shine:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05),inset 1px 0 0 rgba(255,255,255,.12);
}
.card{background:var(--glass-fill);border:1px solid var(--glass-edge);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  box-shadow:var(--glass-shine),0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(67,230,255,.12)}
.card::before{background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 28%,transparent 42%);mix-blend-mode:screen}
.card::after{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent)}
.card:hover{transform:translateY(-3px);box-shadow:var(--glass-shine),0 16px 40px rgba(0,0,0,.45),0 0 24px rgba(67,230,255,.25)}
.card.waiting{border-color:rgba(195,139,255,.55);box-shadow:var(--glass-shine),0 10px 30px rgba(0,0,0,.35),0 0 26px rgba(195,139,255,.28)}
.card.working{border-color:rgba(110,235,255,.5);box-shadow:var(--glass-shine),0 10px 30px rgba(0,0,0,.35),0 0 22px rgba(67,230,255,.25)}
.card.waiting_bg,.card.idle_live{border-color:rgba(122,162,255,.5);box-shadow:var(--glass-shine),0 10px 30px rgba(0,0,0,.35),0 0 22px rgba(122,162,255,.25)}
.ask{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-left:2px solid var(--line-hi);backdrop-filter:blur(6px)}
.chip{background:rgba(255,255,255,.08);border:1px solid var(--glass-edge);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.chip.on{background:rgba(67,230,255,.22)}
header{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--glass-edge);box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
.list{border-left:none;margin-left:0;gap:6px}
.row{background:linear-gradient(90deg,rgba(6,16,34,.55),rgba(6,16,34,.35));border:1px solid rgba(255,255,255,.14);border-radius:12px;
  backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.row::before{left:8px;display:none}
.row:hover{background:rgba(255,255,255,.12);border-color:rgba(120,235,255,.45)}
.row.sel{background:rgba(67,230,255,.16);border-color:var(--cyan)}
#panel{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 40%,rgba(80,200,255,.05));
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-left:1px solid rgba(255,255,255,.28);box-shadow:inset 1px 0 0 rgba(255,255,255,.25),-24px 0 60px rgba(0,0,0,.45)}
#panel-actions{background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.14)}
.md pre{background:rgba(0,8,20,.45);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.state-pill{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
button,input[type=date]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
button.primary{background:linear-gradient(135deg,rgba(67,230,255,.75),rgba(45,212,191,.6));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 16px rgba(67,230,255,.35)}

/* ===== Космос: зорі (canvas), планета з кільцями, супутник ===== */
#stars{position:fixed;inset:0;width:100vw;height:100vh;z-index:-3;pointer-events:none}
.planet{position:fixed;z-index:-2;pointer-events:none;width:46vmin;height:46vmin;right:-12vmin;bottom:-14vmin;border-radius:50%;
  background:
    radial-gradient(circle at 32% 30%,rgba(255,255,255,.35),transparent 22%),
    repeating-linear-gradient(-18deg,rgba(255,255,255,.05) 0 6px,transparent 6px 15px),
    radial-gradient(circle at 35% 35%,#3fd0e6 0%,#1d6fb8 38%,#123a7a 62%,#060f2b 85%);
  box-shadow:inset -5vmin -4vmin 7vmin rgba(0,0,0,.75),0 0 6vmin rgba(67,200,255,.35),0 0 16vmin rgba(67,160,255,.18)}
.planet::after{content:"";position:absolute;left:-30%;right:-30%;top:41%;height:18%;border-radius:50%;
  border:2px solid rgba(160,230,255,.35);border-top-color:rgba(160,230,255,.08);border-bottom-width:5px;
  transform:rotate(-16deg);box-shadow:0 0 18px rgba(120,220,255,.25)}
.moon{position:fixed;z-index:-2;pointer-events:none;width:7vmin;height:7vmin;left:6vw;top:16vh;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#e9e4ff,#9a8fd6 45%,#3b3470 80%);
  box-shadow:inset -1.2vmin -1vmin 1.6vmin rgba(0,0,0,.6),0 0 3vmin rgba(122,162,255,.35)}

/* ===== Тема «Глибокий космос» (html.theme-deep): більше чорного, без великих бликів ===== */
html.theme-deep{background:radial-gradient(ellipse 80% 60% at 70% 20%,#0c1830 0%,transparent 70%),radial-gradient(ellipse 70% 60% at 15% 85%,#081a26 0%,transparent 70%),linear-gradient(180deg,#060c1a,#03060e)}
html.theme-deep .aurora i{opacity:.24;filter:blur(90px)}
html.theme-deep .aurora i:nth-child(1){width:30vw;height:30vw;left:-6vw;top:30vh}
html.theme-deep .aurora i:nth-child(2){width:26vw;height:26vw;right:-4vw;top:-6vh}
html.theme-deep .aurora i:nth-child(3){width:28vw;height:28vw;left:40vw;bottom:-10vh;opacity:.12}
html.theme-deep .aurora i:nth-child(4){display:none}
html.theme-deep .aurora i:nth-child(5){width:18vw;height:18vw;left:62vw;top:38vh;opacity:.1}
html.theme-deep .planet{width:24vmin;height:24vmin;right:4vw;bottom:-6vmin;
  box-shadow:inset -3vmin -2.4vmin 4vmin rgba(0,0,0,.85),0 0 2.2vmin rgba(67,200,255,.25)}
html.theme-deep .planet::after{border-color:rgba(160,230,255,.22);box-shadow:none}
html.theme-deep .moon{width:4vmin;height:4vmin;box-shadow:inset -.8vmin -.6vmin 1vmin rgba(0,0,0,.7),0 0 1vmin rgba(122,162,255,.25)}
html.theme-deep{--glass-fill:linear-gradient(155deg,rgba(90,150,210,.38) 0%,rgba(50,95,165,.3) 45%,rgba(35,125,145,.33) 100%)}
html.theme-deep .card{border-color:rgba(130,225,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 26px rgba(120,200,255,.12),0 10px 30px rgba(0,0,0,.45)}
html.theme-deep .card.waiting{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 30px rgba(195,139,255,.16),0 0 24px rgba(195,139,255,.3)}
html.theme-deep .card.working{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 30px rgba(120,230,255,.2),0 0 22px rgba(67,230,255,.28)}
html.theme-deep .card.waiting_bg,html.theme-deep .card.idle_live{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 30px rgba(122,162,255,.2),0 0 22px rgba(122,162,255,.28)}
html.theme-deep .ask{background:rgba(4,14,30,.35)}
html.theme-deep .card::before{background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.04) 30%,transparent 45%)}
html.theme-deep .card::after{background:linear-gradient(90deg,transparent,rgba(200,245,255,.8),transparent)}
html.theme-deep #panel{background:linear-gradient(160deg,rgba(40,80,120,.62),rgba(10,24,42,.82))}
html.theme-deep header{background:linear-gradient(180deg,rgba(10,24,40,.75),rgba(4,10,20,.55))}
#theme{font:inherit;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.22);background:#0c2036;color:var(--ink);cursor:pointer}

/* ===== Повзунок яскравості бликів (--glow: 0…1.5) ===== */

/* ===== Повзунки скла: --lift (світліше), --shade (темніше), --frost (матовість), --sat (підсилення кольору фону) ===== */
/* Зафіксовано: блики 100%, яскравість плиток 60%, прозорість 100% */
:root{--glow:1;--lift:0;--shade:.36;--frost:0;--sat:1;--blur:2px;--glass-alpha:.25;--fill:1;--fc1:150,200,240;--fa1:.24;--fc2:60,150,190;--fa2:.14}
html.theme-deep{--fc1:90,150,210;--fa1:.38;--fc2:35,125,145;--fa2:.33}
.card,html.theme-deep .card{background:
  linear-gradient(rgba(255,255,255,var(--lift)),rgba(255,255,255,var(--lift))),
  linear-gradient(rgba(3,10,22,calc(var(--shade) + var(--frost))),rgba(3,10,22,calc(var(--shade) + var(--frost)))),
  linear-gradient(155deg,rgba(var(--fc1),calc(var(--fa1) * var(--glass-alpha,1))),rgba(var(--fc2),calc(var(--fa2) * var(--glass-alpha,1))));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
/* Заливка скла слабшає разом із прозорістю: при 100% майже чисте скло */
.card::before{opacity:var(--fill)}
.row{background:
  linear-gradient(rgba(255,255,255,var(--lift)),rgba(255,255,255,var(--lift))),
  linear-gradient(rgba(3,10,22,calc(var(--shade) + var(--frost))),rgba(3,10,22,calc(var(--shade) + var(--frost)))),
  linear-gradient(90deg,rgba(6,16,34,.55),rgba(6,16,34,.35));backdrop-filter:blur(var(--blur)) saturate(var(--sat))}
#panel{box-shadow:inset 0 0 0 100vmax rgba(3,10,22,calc(var(--shade) + var(--frost))),inset 1px 0 0 rgba(255,255,255,.25),-24px 0 60px rgba(0,0,0,.45)}

/* ===== Картки в стилі рядків «Сплять» і панелі: рівне скло, одна тонка рамка, без відблисків і внутрішніх контурів ===== */
html .card,html.theme-deep .card{
  background:
    linear-gradient(rgba(255,255,255,var(--lift)),rgba(255,255,255,var(--lift))),
    linear-gradient(rgba(3,10,22,calc(var(--shade) + var(--frost) * .6)),rgba(3,10,22,calc(var(--shade) + var(--frost) * .6))),

  backdrop-filter:blur(var(--blur)) saturate(1.1);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.1);
  box-shadow:0 8px 24px rgba(0,0,0,.35)}
html .card::before,html .card::after{display:none}
html .card:hover{border-color:rgba(120,235,255,.45);box-shadow:0 10px 28px rgba(0,0,0,.4)}

<script>
function sessionTab() { try { return sessionStorage.getItem("agent-board-tab") || "report"; } catch (e) { return "report"; } }
const S = {tab: sessionTab(), build: null, cards: [], project: null, q: "", view: location.hash === "#projects" ? "projects" : null, projects: null, pjEdit: null,
  sel: location.hash === "#projects" ? null : decodeURIComponent(location.hash.slice(1)) || null, haiku: {}, html: {}, board: "Команда"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// Короткі уривки на картках — без Markdown-розмітки
const cut = (s, n) => { s = String(s || "").replace(/^#{1,6}\s+/gm, "").replace(/\*\*|`+|^\s*[-*]\s+/gm, "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
function age(ts) {
  const m = Math.max(0, (Date.now() / 1000 - ts) / 60);
  if (m < 60) return Math.round(m) + " хв";
  if (m < 1440) return Math.round(m / 60) + " год";
  return Math.round(m / 1440) + " дн";
}
const STATE = {waiting: "🔴 чекає на вас", waiting_bg: "⏳ чекає на фонові задачі", working: "⚙️ працює",
  idle_live: "❓ жива, без відповіді", sleeping: "💤 спить", done: "✓ готово", snoozed: "⏸ відкладено"};
const ZONES = [
  {title: "🔴 Чекають на вас", states: ["waiting"]},
  {title: "⚙️ Працюють", states: ["working", "waiting_bg", "idle_live"]},
  {title: "💤 Сплять", states: ["sleeping"], list: true},
  {title: "🗄 Архів і відкладені", states: ["done", "snoozed"], compact: true, archive: true},
];
const headline = c => c.summary?.about || c.title;
// Маленький безпечний Markdown: спершу екрануємо HTML, потім розмічаємо.
const LINK_RE = /(?:https?:\/\/|(?<![\w.\/@:-])(?:127\.0\.0\.1|localhost):\d+)(?:(?!&quot;|&#39;|&lt;|&gt;)[^\s<`*\u0000])*/g;
const anchor = (url, label) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
// Голі адреси в уже екранованому тексті → посилання; розділові знаки в кінці лишаються текстом.
function links(t) {
  return t.replace(LINK_RE, url => {
    let tail = "";
    for (;;) {
      const m = url.match(/(?:&amp;|[.,;:!?…»”_])$/), last = url.slice(-1);
      const unpaired = (last === ")" && url.split(")").length > url.split("(").length) || (last === "]" && url.split("]").length > url.split("[").length);
      if (url.endsWith("&amp;") || (m && !/&\w+;$/.test(url)) || unpaired) { const n = url.endsWith("&amp;") ? 5 : 1; tail = url.slice(-n) + tail; url = url.slice(0, -n); }
      else break;
    }
    if (/^https?:\/\/$/.test(url)) return url + tail;
    return anchor(url.startsWith("http") ? url : "http://" + url, url) + tail;
  });
}
function mdInline(t) {
  const kept = [], keep = html => `\u0000${kept.push(html) - 1}\u0000`;  // готовий HTML ховаємо, щоб наступні правила його не чіпали
  const emph = x => x.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>");
  t = t.replace(/\u0000/g, "").replace(/`([^`]+)`/g, (_, code) => keep(`<code>${links(code)}</code>`))
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => keep(anchor(url, emph(label))));
  t = emph(links(t).replace(/<a [^>]*>.*?<\/a>/g, keep));
  while (/\u0000\d+\u0000/.test(t)) t = t.replace(/\u0000(\d+)\u0000/g, (_, n) => kept[n]);
  return t;
}
function md(text) {
  const lines = esc(text || "").split("\n"), out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      out.push(`<pre><code>${links(code.join("\n"))}</code></pre>`); i++; continue;
    }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { out.push(`<h${Math.min(m[1].length + 2, 5)}>${mdInline(m[2])}</h${Math.min(m[1].length + 2, 5)}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => mdInline(c.trim()));
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push("<table>" + body.map((r, k) => "<tr>" + cells(r).map(c => k === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^&gt;\s?/.test(line)) {
      const q = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) q.push(lines[i++].replace(/^&gt;\s?/, ""));
      out.push(`<blockquote>${mdInline(q.join("<br>"))}</blockquote>`); continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d/.test(line), items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(x => `<li>${mdInline(x)}</li>`).join("")}</${tag}>`); continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,6}\s|&gt;|\s*([-*+]|\d+[.)])\s|\s*\|)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out.push(`<p>${mdInline(para.join("<br>"))}</p>`);
  }
  return out.join("");
}
function setHtml(id, html) {
  if (S.html[id] === html) return;  // не чіпаємо DOM без змін, щоб не губити кліки й виділення
  S.html[id] = html;
  document.getElementById(id).innerHTML = html;
}
function ask(c) {
  if (c.state === "working") return "⏳ працює…";
  if (c.state === "waiting" && c.live_status === "waiting") return "❓ потрібна ваша відповідь" + (c.live_waiting_for ? ` (${c.live_waiting_for})` : "");
  if (c.state === "waiting_bg") return c.background ? `⏳ чекає на фонові задачі (${c.background})` : "⏳ чекає на фонову команду";
  if (c.state === "idle_live") {
    if (c.live_status && c.live_status !== "idle") return "❓ статус: " + c.live_status;  // невідомий статус — як є
    return c.version ? "❓ остання репліка ваша, агент не відповів" : "ще без реплік";
  }
  if (c.summary?.waiting_for) return "❓ " + c.summary.waiting_for;

  if (chip?.dataset.p !== undefined) { S.project = chip.dataset.p || null; return render(); }
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; try { sessionStorage.setItem("agent-board-tab", S.tab); } catch (e) {} return render(); }
  const button = e.target.closest("[data-act]");
  if (button?.dataset.act === "font") return setFont(button.dataset.k, +button.dataset.d);
  if (button?.dataset.act === "new") return newChat(button.dataset.project || S.project);
  if (button?.dataset.act === "new-all") { S.newFor = null; return render(); }
  if (button?.dataset.act === "new-start") return startChat(S.folders.find(f => f.path === button.dataset.path));
  if (button) return act(button.dataset.act, button);
  const link = e.target.closest("#panel a[href^=http]");
  if (link) { e.preventDefault(); return openLink(link.href); }
  if (e.target.closest("input, textarea")) return;
  const card = e.target.closest(".card");
  if (card) { S.view = null; S.sel = card.dataset.id; history.replaceState(null, "", "#" + encodeURIComponent(S.sel)); render(); return; }
  // Клік по порожньому місцю поза панеллю (фон між картками) закриває панель.
  if ((S.sel || S.view) && !e.target.closest("#panel, header, label, a, select, textarea")) {
    S.sel = null; S.view = null; S.pjEdit = null; S.iconFor = null;
    history.replaceState(null, "", location.pathname); render();
  }
});
document.getElementById("archive").addEventListener("change", render);
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; render(); });
document.getElementById("projects-btn").addEventListener("click", () => {
  S.sel = null; S.view = S.view === "projects" ? null : "projects"; S.pjEdit = null;
  history.replaceState(null, "", location.pathname); render(); if (S.view) loadProjects();
});
document.addEventListener("keydown", e => {
  const q = document.getElementById("q");
  if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  else if (e.key === "Escape" && document.activeElement === q) { q.value = ""; S.q = ""; q.blur(); render(); }
});

// Дошку оновили й перезапустили — оновлюємо сторінку, щойно ви нічого не друкуєте й не диктуєте.
function maybeReload() {
  if (S.stale && !S.fresh && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) && (!window.Term || Term.idle())) location.reload();
}
function apply(d) { S.stale = !!S.build && d.build !== S.build; S.build ??= d.build; maybeReload(); S.dictation = !!d.dictation; document.body.classList.toggle("no-mic", !S.dictation); S.cards = d.cards; S.haiku = d.haiku; S.board = d.board || S.board; document.documentElement.classList.toggle("planet-mars", d.planet === "mars"); render();
  // Лічильники панелі «Проєкти» оновлюємо разом із дошкою, але не посеред введення у формі.
  if (S.view === "projects" && !document.activeElement?.matches("input")) loadProjects(); }
fetch("/api/board").then(r => r.json()).then(apply);
if (S.view === "projects") loadProjects();
function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("board", e => apply(JSON.parse(e.data)));
  // Після 503 (усі слоти зайняті) чи падіння сервера браузер сам не перепідключається.
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) setTimeout(connect, 5000); };
}
connect();
setInterval(render, 60000);
setInterval(maybeReload, 5000);

// Зоряне небо: три шари глибини з паралаксом, мерехтіння, рідкісні падучі зірки.
(function starfield() {
  document.addEventListener("themechange", () => starfield.reset && starfield.reset());
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, stars = [], rocks = [], meteor = null, last = 0;
  // Астероїд: неправильний багатокутник, повільний дрейф і обертання
  function makeRock(anywhere) {
    const r = 3 + Math.random() ** 2 * 13, n = 7 + (Math.random() * 4 | 0), pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * 6.283, k = .65 + Math.random() * .45; pts.push([Math.cos(a) * r * k, Math.sin(a) * r * k]); }
    return {x: anywhere ? Math.random() * w : w + r * 2, y: Math.random() * h, r, pts,
            vx: -(0.004 + Math.random() * 0.012) * (0.6 + r / 16), vy: (Math.random() - .5) * 0.004,
            rot: Math.random() * 6.283, vr: (Math.random() - .5) * 0.0012, shade: 70 + Math.random() * 40};
  }
  function drawRock(o) {
    ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot);
    ctx.beginPath(); o.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    const g = ctx.createLinearGradient(-o.r, -o.r, o.r, o.r);  // світло зліва-зверху
    g.addColorStop(0, `rgb(${o.shade + 40},${o.shade + 50},${o.shade + 70})`); g.addColorStop(.55, `rgb(${o.shade * .5},${o.shade * .55},${o.shade * .7})`); g.addColorStop(1, "rgb(12,16,26)");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "rgba(170,210,255,.18)"; ctx.lineWidth = .7; ctx.stroke();
    ctx.restore();
  }
  const tints = ["255,255,255", "190,235,255", "210,200,255", "255,230,200"];
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const deep = document.documentElement.classList.contains("theme-deep");
    const n = Math.round(w * h / (deep ? 1400 : 3200));  // «Глибокий космос» — густіші й дрібніші зорі
    rocks = Array.from({length: Math.max(6, Math.round(w * h / 160000))}, () => makeRock(true));
    stars = Array.from({length: n}, () => {
      const z = Math.random();  // 0 — далеко, 1 — близько
      const bright = Math.random() < .04;
      const r = deep ? (bright ? 1 + z * .9 : .35 + z * .6) : .3 + z * 1.4;
      const a = deep ? (bright ? .8 + Math.random() * .2 : .35 + Math.random() * .45) : .35 + Math.random() * .6;
      return {x: Math.random() * w, y: Math.random() * h, z, r, a,
              tw: Math.random() * Math.PI * 2, sp: .4 + Math.random() * 1.6, c: tints[Math.random() < .8 ? 0 : 1 + (Math.random() * 3 | 0)]};
    });
  }
  let running = true;
  const flat = () => document.documentElement.classList.contains("flat");  // класичні теми: неба немає, анімацію зупиняємо
  function frame(t) {
    if (flat()) { running = false; return; }
    const dt = Math.min(t - last, 64) || 16; last = t;
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      if (!still) { s.x -= (0.004 + s.z * 0.02) * dt; if (s.x < -2) { s.x = w + 2; s.y = Math.random() * h; } s.tw += s.sp * dt / 1000; }
      const alpha = s.a * (0.65 + 0.35 * Math.sin(s.tw));
      ctx.beginPath(); ctx.fillStyle = `rgba(${s.c},${alpha})`; ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
      if (s.r > 1.35) { ctx.fillStyle = `rgba(${s.c},${alpha * .12})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 4, 0, 6.283); ctx.fill(); }
    }
    for (const o of rocks) {
      if (!still) {
        o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.vr * dt;
        if (o.x < -o.r * 3 || o.y < -o.r * 3 || o.y > h + o.r * 3) Object.assign(o, makeRock(false));
      }
      drawRock(o);
    }
    if (!still) {
      if (!meteor && Math.random() < dt / 9000) meteor = {x: Math.random() * w * .8 + w * .2, y: Math.random() * h * .4, life: 0};
      if (meteor) {
        meteor.life += dt; const k = meteor.life / 900, len = 140;
        const x = meteor.x - k * 520, y = meteor.y + k * 260;
        const g = ctx.createLinearGradient(x, y, x + len, y - len / 2);
        g.addColorStop(0, `rgba(200,245,255,${.9 * (1 - k)})`); g.addColorStop(1, "rgba(200,245,255,0)");
        ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y - len / 2); ctx.stroke();
        if (k >= 1) meteor = null;
      }
      requestAnimationFrame(frame);
    }
  }
  addEventListener("resize", () => { resize(); if (still) frame(0); });
  starfield.reset = () => { resize(); if (still) frame(0); else if (!running && !flat()) { running = true; last = performance.now(); requestAnimationFrame(frame); } };
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !still) { last = performance.now(); } });
  resize(); requestAnimationFrame(frame);
})();

Themes.fill(document.getElementById("theme"));
